name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify tagged commit
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: snipforge-macos
          - os: windows-2022
            artifact-name: snipforge-windows
          - os: ubuntu-latest
            artifact-name: snipforge-linux

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*/*.dmg
            release/*/*.dmg.blockmap
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/*.AppImage
            release/*/latest*.yml

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: snipforge-macos
          path: downloaded/snipforge-macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: snipforge-windows
          path: downloaded/snipforge-windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: snipforge-linux
          path: downloaded/snipforge-linux

      - name: Validate and collect release assets
        run: node scripts/release-assets.mjs collect downloaded release-assets

      - name: Guard existing release
        run: node scripts/release-assets.mjs guard release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SnipForge ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
